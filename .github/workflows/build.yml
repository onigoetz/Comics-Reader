name: Node CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
    - name: Install Node.js
      uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
      with:
        node-version: 22.x
        cache: 'yarn'
    - name: yarn install
      run: yarn install
    - name: Lint server
      run: yarn lint:server
    - name: Lint client
      run: yarn lint:client
    - name: Lint CSS
      run: yarn lint:css
    - name: Typecheck
      run: yarn typecheck
    - name: Build
      run: yarn build
    - name: Install mutool
      run: sudo apt-get install -y mupdf-tools
    - name: Tests
      run: yarn test:ci
